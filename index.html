<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily arXiv Physics Scout Archive</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Daily arXiv Physics Scout</p>
    <h1>Searchable Archive</h1>
    <p class="dek">High-signal daily briefings on heavy-ion collision physics and AI/ML use cases in physics.</p>
    <div class="filter-panel" aria-label="Archive filters">
      <div class="filter-field filter-field-search">
        <label class="search-label" for="archive-search">Search by keyword</label>
        <input id="archive-search" type="search" placeholder="keyword, arXiv number" autocomplete="off">
      </div>
      <div class="filter-field">
        <label class="search-label" for="archive-period">Date range</label>
        <select id="archive-period">
          <option value="all">All archived days</option>
          <option value="3">Last 3 days</option>
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30">Last 30 days</option>
          <option value="custom">Custom range</option>
        </select>
      </div>
      <div class="filter-field date-field">
        <label class="search-label" for="archive-start">Start date</label>
        <input id="archive-start" type="date">
      </div>
      <div class="filter-field date-field">
        <label class="search-label" for="archive-end">End date</label>
        <input id="archive-end" type="date">
      </div>
    </div>
  </header>
  <main>
    <section class="archive-list" id="archive-list" aria-live="polite">
      <article class="archive-card loading-card">
        <div class="card-top"><span>Loading archive metadata</span></div>
        <h2>Preparing daily report cards</h2>
        <p>The archive index is loading the existing report metadata files.</p>
      </article>
    </section>
    <p id="empty-state" class="empty-state" hidden>No reports match that filter.</p>
  </main>
  <script>
    window.ARCHIVE_REPORTS = [
      "2026-08-31", "2026-08-30", "2026-08-29", "2026-08-28", "2026-08-25", "2026-08-24", "2026-08-23",
      "2026-08-22", "2026-08-21", "2026-08-20", "2026-08-19", "2026-08-18", "2026-08-17", "2026-08-16",
      "2026-08-15", "2026-08-13", "2026-08-12", "2026-08-11", "2026-08-10", "2026-08-09", "2026-08-08",
      "2026-08-07", "2026-08-06", "2026-08-04", "2026-08-03", "2026-08-02", "2026-08-01", "2026-07-31",
      "2026-07-30", "2026-07-29", "2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25", "2026-07-24",
      "2026-07-23", "2026-07-22", "2026-07-21", "2026-07-20", "2026-07-19", "2026-07-18", "2026-07-17",
      "2026-07-16", "2026-07-15", "2026-07-14", "2026-07-13", "2026-07-12", "2026-07-11", "2026-07-10",
      "2026-07-09", "2026-07-08", "2026-07-07", "2026-07-06", "2026-07-05", "2026-07-04", "2026-07-03",
      "2026-07-02", "2026-07-01", "2026-06-30", "2026-06-29", "2026-06-28", "2026-06-27", "2026-06-26"
    ].map(function (date) {
      return {date: date, path: "reports/" + date + ".html", metadata: "data/reports/" + date + ".json"};
    });
  </script>
  <script src="assets/filter.js"></script>
</body>
</html>
